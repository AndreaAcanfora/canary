name: Release

# Runs when a v* tag is pushed: builds the firmware for every chip and the
# Linux binaries, attaches them to a GitHub release and updates the web
# installer on GitHub Pages.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    strategy:
      matrix:
        target: [esp32c3, esp32s3, esp32]
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches VERSION
        shell: bash
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build
        shell: bash
        working-directory: firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build -DIDF_TARGET=${{ matrix.target }} build
          cd build
          python -m esptool --chip ${{ matrix.target }} merge_bin -o canary-${{ matrix.target }}.bin @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: firmware/build/canary-${{ matrix.target }}.bin

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compilers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
      - name: Build
        run: |
          mkdir -p dist
          for pair in amd64:gcc arm64:aarch64-linux-gnu-gcc armhf:arm-linux-gnueabihf-gcc; do
            arch=${pair%%:*}; cc=${pair#*:}
            make clean
            make CC=$cc CFLAGS="-std=c11 -O2 -Wall -Wextra" linux
            cp build/canary dist/canary-linux-$arch
          done
          file dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  release:
    needs: [firmware, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          gh release create "$GITHUB_REF_NAME" dist/* --title "canary $GITHUB_REF_NAME" --generate-notes

  pages:
    needs: release
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
